<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cronómetro a pantalla completa — Colores por tiempo</title>
  <meta name="description" content="Cronómetro simple a pantalla completa que cambia el color de fondo según el tiempo transcurrido y expone un pequeño sistema de eventos." />
  <style>
    :root{
      --bg:#111;
      --fg:#fff;
      --accent: #7dd3fc;
      --ok: #22c55e;
      --warn:#facc15;
      --bad: #ef4444;
      --muted:#9ca3af;
      --card:#1b1b1b;
      --shadow: 0 10px 25px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box}
    html,body{
      height:100%;
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      background: var(--bg);
      color: var(--fg);
    }
    .app{
      height:100%;
      display:flex;
      flex-direction:column;
    }
    .display{
      flex:1;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      padding: clamp(12px, 2vw, 32px);
      transition: background-color .35s ease;
      background: var(--zone-color, var(--bg));
    }
    .time{
      font-variant-numeric: tabular-nums;
      font-size: clamp(48px, 14vw, 180px);
      line-height:1;
      font-weight: 800;
      letter-spacing: .03em;
      text-shadow: 0 2px 6px rgba(0,0,0,.35);
      text-align:center;
    }
    .sub{
      margin-top:.5rem;
      font-size: clamp(12px, 2.5vw, 16px);
      color: var(--muted);
      text-align:center;
    }
    .controls{
      display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; justify-content:center;
      padding: 12px;
      background: linear-gradient(to top, rgba(0,0,0,.25), rgba(0,0,0,0));
    }
    button, input, select{
      font: inherit;
      color: inherit;
    }
    .btn{
      background: var(--card);
      border: 1px solid rgba(255,255,255,.08);
      padding: .7rem 1rem;
      border-radius: 14px;
      cursor:pointer;
      box-shadow: var(--shadow);
      transition: transform .06s ease, background .2s ease, border-color .2s ease;
    }
    .btn:hover{ transform: translateY(-1px); }
    .btn:active{ transform: translateY(0); }
    .btn.primary{ background: var(--accent); color:#062432; border-color: rgba(0,0,0,.12); font-weight:700;}

    .panel{
      margin: 12px auto 16px;
      width: min(1100px, 96vw);
      background: var(--card);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 16px;
      padding: 12px 14px;
      box-shadow: var(--shadow);
      transition: opacity .3s ease, transform .3s ease, height .3s ease;
    }
    .panel.hidden{
      opacity:0;
      pointer-events:none;
      transform:translateY(20px);
      height:0;
      margin:0;
      padding:0;
    }
    details>summary{
      cursor:pointer;
      list-style:none;
      font-weight:700;
      padding:8px 6px;
    }
    details>summary::marker{ display:none }

    .grid{
      display:grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap:12px;
    }
    .field{ display:flex; flex-direction:column; gap:6px; }
    .field label{ font-size:.9rem; color: var(--muted); }
    .field input[type="number"], .field input[type="text"], .field input[type="color"]{
      background:#121212; border:1px solid rgba(255,255,255,.1); padding:.6rem .7rem; border-radius:10px;
    }
    .switch{
      display:flex; align-items:center; gap:8px; margin-top: 6px;
    }
    .log{
      max-height: 200px; overflow:auto; padding:8px; background:#0d0d0d; border-radius: 10px; border:1px solid rgba(255,255,255,.05);
      font-size:.9rem;
    }
    .log .item{ opacity:.9; padding:4px 0; border-bottom: 1px dashed rgba(255,255,255,.06); }
    .log .item:last-child{ border-bottom: none; }
    @media (max-width: 720px){ .grid{ grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="app">
    <header class="controls">
      <button id="startPause" class="btn primary">Iniciar</button>
      <button id="reset" class="btn">Reiniciar</button>
      <button id="fullscreen" class="btn">Pantalla completa</button>
      <label class="switch"><input id="wakeLockToggle" type="checkbox" /> Mantener pantalla encendida</label>
    </header>

    <main class="display" id="display">
      <div>
        <div class="time" id="time">00:00.0</div>
        <div class="sub" id="stateLabel">Listo</div>
      </div>
    </main>

    <section class="panel" id="optionsPanel">
      <details open>
        <summary>Opciones</summary>
        <div class="grid" style="margin-top:10px;">
          <div class="field">
            <label>Umbral 1 (segundos) — «≤ U1 = Rojo»</label>
            <input id="t1" type="number" min="0" step="1" value="300" />
          </div>
          <div class="field">
            <label>Umbral 2 (segundos) — «> U1 y ≤ U2 = Verde»</label>
            <input id="t2" type="number" min="0" step="1" value="540" />
          </div>
          <div class="field">
            <label>Formato</label>
            <select id="format">
              <option value="mm:ss.d">mm:ss.d</option>
              <option value="mm:ss">mm:ss</option>
              <option value="hh:mm:ss">hh:mm:ss</option>
            </select>
          </div>
          <div class="field">
            <label>Color Zona 1 (≤ U1)</label>
            <input id="c1" type="color" value="#ef4444" />
          </div>
          <div class="field">
            <label>Color Zona 2 (> U1 y ≤ U2)</label>
            <input id="c2" type="color" value="#22c55e" />
          </div>
          <div class="field">
            <label>Color Zona 3 (> U2)</label>
            <input id="c3" type="color" value="#facc15" />
          </div>
        </div>
        <div class="switch">
          <input id="tickRate" type="range" min="20" max="240" step="1" value="60" />
          <label for="tickRate">Frecuencia de actualización (~60 FPS por defecto)</label>
        </div>
      </details>
      <details style="margin-top:10px;">
        <summary>Eventos (log)</summary>
        <div class="log" id="log"></div>
      </details>
    </section>
  </div>

  <script>
    const $ = (s)=>document.querySelector(s);
    const display = $('#display');
    const timeEl = $('#time');
    const stateLabel = $('#stateLabel');
    const t1El = $('#t1');
    const t2El = $('#t2');
    const c1El = $('#c1');
    const c2El = $('#c2');
    const c3El = $('#c3');
    const fmtEl = $('#format');
    const tickEl = $('#tickRate');
    const startPauseBtn = $('#startPause');
    const resetBtn = $('#reset');
    const fsBtn = $('#fullscreen');
    const panel = $('#optionsPanel');
    const wakeToggle = $('#wakeLockToggle');
    const logBox = $('#log');

    const addLog=(m)=>{const ts=new Date().toLocaleTimeString();const d=document.createElement('div');d.className='item';d.textContent=`[${ts}] ${m}`;logBox.prepend(d);};

    class Emitter{constructor(){this.map=new Map();}on(e,f){if(!this.map.has(e))this.map.set(e,new Set());this.map.get(e).add(f);return()=>this.off(e,f);}off(e,f){this.map.get(e)?.delete(f);}emit(e,...a){this.map.get(e)?.forEach(fn=>{try{fn(...a);}catch(err){console.error(err)}})}}

    class Stopwatch extends Emitter{constructor(){super();this.reset();this._loop=this._loop.bind(this);this.fpsTarget=60;}start(){if(this.running)return;this.running=true;this.startEpoch=performance.now()-this.elapsedMs;this.emit('start',this.elapsedMs);addLog('▶️ Iniciado');this._raf=requestAnimationFrame(this._loop);}pause(){if(!this.running)return;this.running=false;cancelAnimationFrame(this._raf);this.elapsedMs=performance.now()-this.startEpoch;this.emit('pause',this.elapsedMs);addLog('⏸️ Pausado');}reset(){this.running=false;this.startEpoch=0;this.elapsedMs=0;this.lastZone=null;cancelAnimationFrame?.(this._raf);this.emit?.('reset');addLog('↩️ Reiniciado');} _loop(){if(!this.running)return;const now=performance.now();this.elapsedMs=now-this.startEpoch;this.emit('tick',this.elapsedMs);this._raf=requestAnimationFrame(this._loop);}get timeMs(){return this.elapsedMs|0;}get timeSec(){return this.timeMs/1000;}}

    function formatTime(ms,mode){const total=Math.floor(ms/1000);const msDec=Math.floor((ms%1000)/100);const s=total%60;const m=Math.floor(total/60)%60;const h=Math.floor(total/3600);const pad=(n)=>String(n).padStart(2,'0');switch(mode){case'mm:ss':return`${pad(m)}:${pad(s)}`;case'hh:mm:ss':return`${pad(h)}:${pad(m)}:${pad(s)}`;default:return`${pad(m)}:${pad(s)}.${msDec}`}}

    const timer=new Stopwatch();window.timer=timer;

    function zoneFor(seconds,u1,u2){if(seconds<=u1)return 1;if(seconds<=u2)return 2;return 3;}
    function applyZone(zone){const colors={1:c1El.value,2:c2El.value,3:c3El.value};display.style.setProperty('--zone-color',colors[zone]);if(timer.lastZone!==zone){timer.lastZone=zone;timer.emit(`zone:${zone}`,timer.timeMs);addLog(`🎯 Zona ${zone}`)}}

    timer.on('tick',(ms)=>{timeEl.textContent=formatTime(ms,fmtEl.value);const secs=ms/1000;const u1=+t1El.value;const u2=+t2El.value;applyZone(zoneFor(secs,u1,u2));});
    timer.on('start',()=>{stateLabel.textContent='Contando…';startPauseBtn.textContent='Pausar';});
    timer.on('pause',()=>{stateLabel.textContent='Pausado';startPauseBtn.textContent='Reanudar';});
    timer.on('reset',()=>{stateLabel.textContent='Listo';startPauseBtn.textContent='Iniciar';timeEl.textContent=formatTime(0,fmtEl.value);display.style.setProperty('--zone-color','#111');});

    startPauseBtn.onclick=()=>timer.running?timer.pause():timer.start();
    resetBtn.onclick=()=>timer.reset();

    fsBtn.onclick=async()=>{if(!document.fullscreenElement){await document.documentElement.requestFullscreen();fsBtn.textContent='Salir de pantalla completa';panel.classList.add('hidden');document.querySelector('.app').style.height='100vh';}else{await document.exitFullscreen();fsBtn.textContent='Pantalla completa';panel.classList.remove('hidden');document.querySelector('.app').style.height='100%';}};

    let wakeLock=null;async function requestWakeLock(){try{wakeLock=await navigator.wakeLock?.request('screen');wakeLock?.addEventListener('release',()=>{wakeToggle.checked=false;});}catch(e){console.warn('WakeLock no disponible',e);}}
    wakeToggle.onchange=()=>{if(wakeToggle.checked)requestWakeLock();else{wakeLock?.release?.();wakeLock=null;}};

    timeEl.textContent=formatTime(0,fmtEl.value);applyZone(1);
  </script>
</body>
</html>
