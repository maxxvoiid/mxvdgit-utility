<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Umbral Timer | mxvdgit-utility</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="controls">
      <button id="startPause" class="btn primary">Iniciar</button>
      <button id="reset" class="btn">Reiniciar</button>
      <button id="fullscreen" class="btn">Pantalla completa</button>
      <label class="switch"><input id="wakeLockToggle" type="checkbox" /> Mantener pantalla encendida</label>
    </header>

    <main class="display" id="display">
      <div>
        <div class="time" id="time">00:00.0</div>
        <div class="sub" id="stateLabel">Listo</div>
      </div>
    </main>

    <section class="panel" id="optionsPanel">
        <details open>
        <summary>Umbrales</summary>
        <div id="thresholdList" class="grid"></div>
        <button id="addThreshold" class="btn">+ Agregar umbral</button>
        </details>
      <details open>
        <summary>Opciones</summary>
        <div class="grid" style="margin-top:10px;">
          <div class="field select">
            <label>Formato</label>
            <select id="format">
              <option value="mm:ss.d">mm:ss.d</option>
              <option value="mm:ss.dd">mm:ss.dd</option>
              <option value="mm:ss">mm:ss</option>
              <option value="hh:mm:ss">hh:mm:ss</option>
            </select>
          </div>
          <div class="field">
                <div class="speed-header">
                    <label>Velocidad</label>
                    <span id="speedLabel">×1.0</span>
                </div>
              <input id="speedMultiplier" type="range" min="0.25" max="10" step="0.25" value="1" />
          </div>
        </div>
      </details>
      <details style="margin-top:10px;">
        <summary>Eventos (log)</summary>
        <div class="log" id="log"></div>
      </details>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
